<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' https://tile.openstreetmap.org data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://tile.openstreetmap.org https://ep-little-mountain-b3ttfx56.neonauth.c-4.ap-southeast-1.aws.neon.tech https://*.neon.tech; base-uri 'self'" />
    <meta name="description" content="RapidRelief — AI smart disaster response and emergency management for Dhaka." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f2" />
    <title>RapidRelief</title>
    <base href="/" />
    <!-- Theme is applied before first paint; external file because the CSP forbids inline scripts. -->
    <script src="js/theme.js"></script>
    <link rel="preload" href="fonts/lexend-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="hero%20images/earthquake.jpg" fetchpriority="high" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/leaflet/leaflet.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/landing.css" />
    <link rel="stylesheet" href="css/auth-pages.css" />
    <link rel="stylesheet" href="css/dashboards.css" />
    <link rel="stylesheet" href="css/command.css" />
    <link rel="stylesheet" href="css/ai.css" />
    <!-- Last: unifies the button systems and adds the shared component layer. -->
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/citizen.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="logo%20(2).png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="logo%20(2).png?v=3" />
    <link rel="icon" type="image/png" href="logo.png?v=3" />
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=3" />
    <link href="RapidRelief.Client.styles.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="logo%20(2).png?v=3" />
    <link rel="apple-touch-icon" sizes="192x192" href="logo%20(2).png?v=3" />
    <link rel="apple-touch-icon" href="logo%20(2).png?v=3" />
</head>

<body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-brand" aria-hidden="true">
                <img src="logo.png" alt="RapidRelief Logo" class="boot-mark" style="width: 48px; height: 48px; object-fit: contain; margin-bottom: 0.75rem;" />
                <span class="boot-name">RapidRelief</span>
            </div>
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss" role="button" aria-label="Dismiss">✕</a>
    </div>
    <!-- Leaflet 1.9.4 vendored locally (UMD global L) — CDN references are forbidden (PWA/offline rule). -->
    <script src="lib/leaflet/leaflet.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Service-worker registration lives in an external file: the CSP forbids inline scripts. -->
    <script src="js/app-init.js"></script>
    <script src="js/landing.js"></script>
    <script src="js/auth-helper.js"></script>
    <script src="js/dialog.js"></script>
</body>

</html>
