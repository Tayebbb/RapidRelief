name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (SQLite/unit/arch — no services)
        run: dotnet test -c Release --no-build

  # Proves the generated migrations are valid Npgsql SQL against a real postgres:16.
  # Extend with one `dotnet ef database update --context <X>` line per future context.
  postgres-fidelity:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rapidrelief
          POSTGRES_PASSWORD: rapidrelief_dev
          POSTGRES_DB: rapidrelief
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rapidrelief"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Apply SampleDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context SampleDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"
