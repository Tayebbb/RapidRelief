name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        # Root holds both RapidRelief.sln and RapidRelief.slnx — bare dotnet commands fail with MSB1011.
        run: dotnet restore RapidRelief.sln

      - name: Build
        run: dotnet build RapidRelief.sln -c Release --no-restore

      # D-117: -m:1 caps MSBuild/testhost parallelism — a full-solution run occasionally hit
      # System.OutOfMemoryException on a resource-constrained runner (two WebApplicationFactory-
      # backed test projects JIT-ing Reflection.Emit concurrently); a rerun always passed clean,
      # but a red CI run that gets reflexively re-run risks masking a real future regression.
      - name: Test (SQLite/unit/arch — no services)
        run: dotnet test RapidRelief.sln -c Release --no-build -m:1

      # D-117: this was "unassessed, not clean" per docs/FINAL-AUDIT.md — a manual
      # `dotnet list package --vulnerable` run is easy to forget before a release, so it's a gate now.
      - name: Check for known-vulnerable packages
        run: |
          dotnet list RapidRelief.sln package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Known-vulnerable package(s) found — see the list above"
            exit 1
          fi

      # D-117: render.yaml/Dockerfile were never exercised by CI, so either could silently rot
      # (a broken Dockerfile would only surface on an actual Render deploy attempt).
      - name: Build the production Dockerfile
        run: docker build -t rapidrelief:ci .

  # Proves the generated migrations are valid Npgsql SQL against a real postgres:16.
  # Extend with one `dotnet ef database update --context <X>` line per future context.
  postgres-fidelity:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rapidrelief
          POSTGRES_PASSWORD: rapidrelief_dev
          POSTGRES_DB: rapidrelief
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rapidrelief"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Apply SampleDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context SampleDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"

      - name: Apply AuthDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context AuthDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"

      - name: Apply AiDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context AiDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"

      - name: Apply NotificationsDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context NotificationsDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"

      - name: Apply OpsDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context OpsDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"

      - name: Apply AlertsDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context AlertsDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"

      - name: Apply IncidentsDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context IncidentsDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"

      - name: Apply RescueDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context RescueDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"

      - name: Apply ReliefDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context ReliefDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"

      - name: Apply AuditDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context AuditDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"

      - name: Apply RegistryDbContext migrations
        run: dotnet ef database update --project src/RapidRelief.Api --context RegistryDbContext
        env:
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=rapidrelief;Username=rapidrelief;Password=rapidrelief_dev"
